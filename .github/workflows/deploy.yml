name: Deploy niannian

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: niannian

jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: niannian/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy to server (SSH)
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 通过 SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            REPO_ROOT="${{ secrets.DEPLOY_PATH }}"
            APP_DIR="$REPO_ROOT/niannian"

            if [ ! -d "$REPO_ROOT/.git" ]; then
              echo "错误: DEPLOY_PATH 应指向 git 仓库根目录（含 .git），当前: $REPO_ROOT"
              exit 1
            fi
            if [ ! -f "$APP_DIR/package.json" ]; then
              echo "错误: 未找到 $APP_DIR/package.json"
              exit 1
            fi

            cd "$REPO_ROOT"
            git pull origin main

            cd "$APP_DIR"
            npm ci --omit=dev
            npm run build
            pm2 restart niannian || pm2 start npm --name niannian -- run start
