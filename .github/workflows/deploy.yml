name: Deploy niannian

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: niannian

jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: niannian/package-lock.json
      - run: npm ci
      - run: npm run build

  # 生产部署由服务器 cron 执行 scripts/auto-deploy.sh（内网无法 HTTPS 连 GitHub）
  # 见 README「方式二：自动部署」
