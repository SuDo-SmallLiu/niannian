server {
	listen 80;
	listen [::]:80;
	listen 443 ssl;
	listen [::]:443 ssl;
	listen 8799 ssl;
	listen [::]:8799 ssl;
	server_name niannian-years.top www.niannian-years.top 39.170.98.199 _;

	client_max_body_size 200m;
	client_body_timeout 300s;
	client_body_buffer_size 128k;

	# TLS：正式投稿请改用 Let's Encrypt
	# sudo certbot certonly --nginx -d niannian-years.top -d www.niannian-years.top
	# ssl_certificate /etc/letsencrypt/live/niannian-years.top/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/niannian-years.top/privkey.pem;
	ssl_certificate /etc/nginx/ssl/selfsigned.crt;
	ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

	# 念念 MCP（Streamable HTTP）→ Python MCP :8080
	location /mcp {
		proxy_pass http://127.0.0.1:8080/mcp;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Connection "";
		proxy_buffering off;
		proxy_read_timeout 86400s;
		proxy_send_timeout 86400s;
	}

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_request_buffering off;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 86400;
		proxy_send_timeout 86400;
		proxy_connect_timeout 300s;
	}
}
